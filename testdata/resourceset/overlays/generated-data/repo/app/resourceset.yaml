apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: demo
  namespace: flux-system
spec:
  inputs:
  - name: one
  resources:
  - apiVersion: v1
    data:
      key: value
    kind: ConfigMap
    metadata:
      name: cm-<< inputs.name >>
      namespace: default
  - apiVersion: v1
    kind: Secret
    metadata:
      name: secret-<< inputs.name >>
      namespace: default
    stringData:
      key: value
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: sa-<< inputs.name >>
      namespace: default
