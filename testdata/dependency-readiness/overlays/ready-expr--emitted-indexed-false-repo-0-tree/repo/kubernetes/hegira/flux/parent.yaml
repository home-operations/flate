apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: parent
  namespace: flux-system
spec:
  path: ./kubernetes/hegira/children
  patches:
  - target: {kind: Kustomization, name: child}
    patch: |-
      - op: replace
        path: /spec/postBuild/substitute/releaseVersion
        value: v1
