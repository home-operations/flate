apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: working
  namespace: flux-system
spec:
  interval: 10m
  url: git://fixture.invalid/cluster
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: producer
  namespace: apps
spec:
  path: ./producer
  sourceRef:
    kind: GitRepository
    name: working
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: consumer
  namespace: apps
spec:
  path: ./consumer
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: hello
    - kind: Secret
      name: settings
  sourceRef:
    kind: GitRepository
    name: working
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sibling
  namespace: apps
spec:
  path: ./sibling
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: stable-settings
  sourceRef:
    kind: GitRepository
    name: working
    namespace: flux-system
