apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: bundle
  namespace: flux-system
spec:
  interval: 1m
  url: oci://registry.invalid/bundle
  ref:
    tag: latest
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: load
  namespace: flux-system
spec:
  interval: 1m
  path: ./
  prune: true
  sourceRef:
    kind: OCIRepository
    name: bundle
