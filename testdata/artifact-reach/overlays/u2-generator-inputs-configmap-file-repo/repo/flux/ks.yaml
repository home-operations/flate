apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: producer
  namespace: flux-system
spec:
  path: ./producer
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: consumer
  namespace: flux-system
spec:
  path: ./consumer
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: settings
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sibling
  namespace: flux-system
spec:
  path: ./sibling
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: stable-settings
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: unrelated
  namespace: flux-system
spec:
  path: ./unrelated
  sourceRef:
    kind: GitRepository
    name: flux-system
