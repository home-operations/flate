apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  annotations: {fluxcd.controlplane.io/reconcile: disabled}
  name: home-assistant-db
  namespace: home-assistant
spec:
  resources:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: home-assistant-db-connection
      namespace: home-assistant
    data:
      database: home-assistant-db
