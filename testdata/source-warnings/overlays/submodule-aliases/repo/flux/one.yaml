apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: one
  namespace: flux-system
spec:
  interval: 1m
  url: https://example.invalid/cluster
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: one
  namespace: flux-system
spec:
  path: ./apps
  sourceRef:
    kind: GitRepository
    name: one
