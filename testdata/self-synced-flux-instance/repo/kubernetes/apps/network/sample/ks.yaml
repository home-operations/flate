apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sample
spec:
  dependsOn:
    - name: flux-instance
      namespace: flux-system
  interval: 1h
  path: ./kubernetes/apps/network/sample
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
