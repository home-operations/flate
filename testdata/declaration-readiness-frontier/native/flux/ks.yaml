apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: cluster-config, namespace: flux-system}
spec:
  interval: 1h
  sourceRef: {kind: OCIRepository, name: flux-system, namespace: flux-system}
  dependsOn: [{name: platform}]
  path: ./work
  postBuild:
    substituteFrom:
    - {kind: ConfigMap, name: cluster-vars}
