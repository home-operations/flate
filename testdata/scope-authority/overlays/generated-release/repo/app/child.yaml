---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: generator
  namespace: flux-system
spec:
  resourcesTemplate: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: invalid
      namespace: flux-system
    spec:
      chart:
        spec:
          chart: charts/demo
          sourceRef:
            kind: GitRepository
            name: flux-system
      interval: []
      suspend: true
