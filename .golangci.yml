# golangci-lint v2.15.0 configuration with flate rules.
# https://github.com/maratori/golangci-lint-config
# Copyright (c) 2021-2025 Marat Reimers. MIT license: https://opensource.org/license/mit
version: "2"
run:
  timeout: 5m
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - clickhouselint
    - containedctx
    - copyloopvar
    - cyclop
    - depguard
    - dupl
    - durationcheck
    - embeddedstructfieldcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - funcorder
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - iface
    - ineffassign
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck
  settings:
    cyclop:
      max-complexity: 30
      package-average: 10.0
    depguard:
      rules:
        deprecated:
          files:
            - $all
          deny:
            - pkg: github.com/golang/protobuf
              desc: Use google.golang.org/protobuf instead, see https://developers.google.com/protocol-buffers/docs/reference/go/faq#modules
            - pkg: github.com/satori/go.uuid
              desc: Use github.com/google/uuid instead, satori's package is not maintained
            - pkg: github.com/gofrs/uuid$
              desc: Use github.com/gofrs/uuid/v5 or later, it was not a go module before v5
        non-test files:
          files:
            - "!$test"
          deny:
            - pkg: math/rand$
              desc: Use math/rand/v2 instead, see https://go.dev/blog/randv2
        non-main files:
          # Tests and logging owners route or restore dependency logging.
          files:
            - "!**/main.go"
            - "!$test"
            - "!**/internal/cli/root.go"
            - "!**/test/e2e/internal/harness/case.go"
          deny:
            - pkg: log$
              desc: Use log/slog instead, see https://go.dev/blog/slog
        stdlib-tests:
          files: ["$all"]
          deny:
            - pkg: github.com/stretchr/testify
              desc: tests use the standard testing package
            - pkg: github.com/onsi/ginkgo
              desc: tests use the standard testing package
            - pkg: github.com/onsi/gomega
              desc: tests use the standard testing package
        tree-stdlib-only:
          list-mode: strict
          files: ["**/pkg/tree/**", "!$test"]
          allow: ["$gostd"]
        claimpath-stdlib-only:
          list-mode: strict
          files: ["**/internal/claimpath/**", "!$test"]
          allow: ["$gostd"]
        inputprojection:
          list-mode: strict
          files: ["**/internal/inputprojection/**"]
          allow:
            - $gostd
            - github.com/home-operations/flate/pkg/manifest
        leaf:
          files:
            - "**/pkg/manifest/**"
            - "**/pkg/task/**"
            - "**/pkg/source/safepath/**"
            - "**/pkg/source/sourceignore/**"
            - "**/pkg/source/ssrfguard/**"
            - "**/internal/assert/**"
            - "**/internal/chartinput/**"
            - "**/internal/fetcherr/**"
            - "**/internal/httpconditional/**"
            - "**/internal/kustpath/**"
            - "**/internal/kustomizeinput/**"
            - "**/internal/resourcesetinput/**"
            - "!$test"
          deny:
            - pkg: github.com/home-operations/flate/pkg
              desc: leaf packages import nothing from pkg/
        selection:
          list-mode: strict
          files: ["**/pkg/selection/**", "!$test"]
          allow:
            - $gostd
            - github.com/home-operations/flate/pkg/manifest
            - github.com/home-operations/flate/pkg/store
            - github.com/home-operations/flate/pkg/change
        selection-foundation:
          files:
            - "**/pkg/manifest/**"
            - "**/pkg/store/**"
            - "**/pkg/change/**"
            - "**/pkg/source/**"
            - "**/pkg/values/**"
            - "**/pkg/schedule/**"
            - "!$test"
          deny:
            - pkg: github.com/home-operations/flate/pkg/selection
              desc: facts do not depend on render selection
        store:
          files: ["**/pkg/store/**", "!$test"]
          deny:
            - pkg: github.com/home-operations/flate/pkg/loader
              desc: store sits below loader, values, depwait, change and source
            - pkg: github.com/home-operations/flate/pkg/values
              desc: store sits below loader, values, depwait, change and source
            - pkg: github.com/home-operations/flate/pkg/depwait
              desc: store sits below loader, values, depwait, change and source
            - pkg: github.com/home-operations/flate/pkg/change
              desc: store sits below loader, values, depwait, change and source
            - pkg: github.com/home-operations/flate/pkg/source
              desc: store sits below loader, values, depwait, change and source
            - pkg: github.com/home-operations/flate/pkg/kustomize
              desc: store is below the render layer
            - pkg: github.com/home-operations/flate/pkg/helm
              desc: store is below the render layer
            - pkg: github.com/home-operations/flate/pkg/discovery
              desc: store is below the render layer
            - pkg: github.com/home-operations/flate/pkg/baseline
              desc: store is below the render layer
            - pkg: github.com/home-operations/flate/pkg/resourceset
              desc: store is below the render layer
            - pkg: github.com/home-operations/flate/pkg/diff
              desc: store is below the render layer
            - pkg: github.com/home-operations/flate/pkg/controllers
              desc: store is below the controllers
            - pkg: github.com/home-operations/flate/pkg/orchestrator
              desc: store is below the orchestrator
        schedule:
          # A leaf behind its Dispatcher seam: stdlib, manifest and task only.
          list-mode: strict
          files: ["**/pkg/schedule/**", "!$test"]
          allow:
            - $gostd
            - github.com/home-operations/flate/pkg/manifest
            - github.com/home-operations/flate/pkg/task
        middle:
          files:
            - "**/pkg/loader/**"
            - "**/pkg/values/**"
            - "**/pkg/depwait/**"
            - "**/pkg/change/**"
            - "**/pkg/source/**"
            - "!$test"
          deny:
            - pkg: github.com/home-operations/flate/pkg/kustomize
              desc: below the render layer
            - pkg: github.com/home-operations/flate/pkg/helm
              desc: below the render layer
            - pkg: github.com/home-operations/flate/pkg/discovery
              desc: below the render layer
            - pkg: github.com/home-operations/flate/pkg/baseline
              desc: below the render layer
            - pkg: github.com/home-operations/flate/pkg/resourceset
              desc: below the render layer
            - pkg: github.com/home-operations/flate/pkg/diff
              desc: below the render layer
            - pkg: github.com/home-operations/flate/pkg/controllers
              desc: below the controllers
            - pkg: github.com/home-operations/flate/pkg/orchestrator
              desc: below the orchestrator
        diff:
          files: ["**/pkg/diff/**", "!$test"]
          deny:
            - pkg: github.com/home-operations/flate/internal/output
              desc: diff owns comparison and presentation names
            - pkg: github.com/home-operations/flate/internal/cli
              desc: diff sits below CLI adaptation
        output:
          files: ["**/internal/output/**", "!$test"]
          deny:
            - pkg: github.com/home-operations/flate/internal/cli
              desc: output sits below CLI presentation
        render:
          files:
            - "**/pkg/kustomize/**"
            - "**/pkg/helm/**"
            - "**/pkg/discovery/**"
            - "**/pkg/baseline/**"
            - "**/pkg/resourceset/**"
            - "**/pkg/diff/**"
            - "!$test"
          deny:
            - pkg: github.com/home-operations/flate/pkg/controllers
              desc: below the controllers
            - pkg: github.com/home-operations/flate/pkg/orchestrator
              desc: below the orchestrator
        controllers-base:
          files: ["**/pkg/controllers/base/**", "!$test"]
          deny:
            - pkg: github.com/home-operations/flate/pkg/controllers/helmrelease
              desc: base is below the kind controllers
            - pkg: github.com/home-operations/flate/pkg/controllers/kustomization
              desc: base is below the kind controllers
            - pkg: github.com/home-operations/flate/pkg/controllers/artifactgenerator
              desc: base is below the kind controllers
            - pkg: github.com/home-operations/flate/pkg/controllers/resourceset
              desc: base is below the kind controllers
            - pkg: github.com/home-operations/flate/pkg/controllers/source
              desc: base is below the kind controllers
            - pkg: github.com/home-operations/flate/pkg/orchestrator
              desc: below the orchestrator
        controllers:
          files: ["**/pkg/controllers/**", "!$test"]
          deny:
            - pkg: github.com/home-operations/flate/pkg/orchestrator
              desc: controllers are below the orchestrator
        no-upward-to-cli:
          files: ["**/pkg/**", "!$test"]
          deny:
            - pkg: github.com/home-operations/flate/internal/cli
              desc: pkg/ never imports internal/cli
    embeddedstructfieldcheck:
      forbid-mutex: true
    errcheck:
      check-type-assertions: true
    exhaustive:
      check:
        - switch
        - mapliteral
    exhaustruct_v5:
      ignore-patterns:
        - ^net/http.Client$
        - ^net/http.Cookie$
        - ^net/http.Request$
        - ^net/http.Response$
        - ^net/http.Server$
        - ^net/http.Transport$
        - ^net/url.URL$
        - ^os/exec.Cmd$
        - ^reflect.StructField$
        - ^github.com/Shopify/sarama.Config$
        - ^github.com/Shopify/sarama.ProducerMessage$
        - ^github.com/mitchellh/mapstructure.DecoderConfig$
        - ^github.com/prometheus/client_golang/.+Opts$
        - ^github.com/spf13/cobra.Command$
        - ^github.com/spf13/cobra.CompletionOptions$
        - ^github.com/stretchr/testify/mock.Mock$
        - ^github.com/testcontainers/testcontainers-go.+Request$
        - ^github.com/testcontainers/testcontainers-go.FromDockerfile$
        - ^golang.org/x/tools/go/analysis.Analyzer$
        - ^google.golang.org/protobuf/.+Options$
        - ^gopkg.in/yaml.v3.Node$
      allow-empty-returns: true
      allow-empty-blank-assignments: true
    funcorder:
      struct-method: false
    funlen:
      lines: 100
      statements: 50
    gochecksumtype:
      default-signifies-exhaustive: false
    gocognit:
      min-complexity: 20
    gocritic:
      settings:
        captLocal:
          paramsOnly: false
        underef:
          skipRecvDeref: false
      enabled-tags: [diagnostic, style]
      enabled-checks:
        - hugeParam
        - rangeValCopy
    godoclint:
      enable:
        - no-unused-link
        - require-stdlib-doclink
    govet:
      enable-all: true
      disable:
        - fieldalignment
      settings:
        shadow: {}
    inamedparam:
      skip-single-param: true
    mnd:
      ignored-functions:
        - args.Error
        - flag.Arg
        - flag.Duration.*
        - flag.Float.*
        - flag.Int.*
        - flag.Uint.*
        - os.Chmod
        - os.Mkdir.*
        - os.OpenFile
        - os.WriteFile
        - prometheus.ExponentialBuckets.*
        - prometheus.LinearBuckets
    nakedret:
      max-func-lines: 0
    # Nil maps represent empty readable collections.
    nilnil:
      checked-types: [ptr, func, iface, chan, uintptr, unsafeptr]
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    perfsprint:
      strconcat: false
      error-format: false
    reassign:
      patterns:
        - .*
    rowserrcheck:
      packages:
        - github.com/jmoiron/sqlx
    sloglint:
      static-msg: true
      kv-only: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1016
        - -QF1008
    usetesting:
      os-temp-dir: true
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^context\.Background$
          msg: context.Background belongs to internal/cli, or to documented shared work such as the remote fetch workers
        # The go-git writer adapter is not the deprecated standard package.
        - pattern: ^ioutil\.
          msg: use the io and os packages
          pkg: ^io/ioutil$
        - pattern: ^fmt\.Print(f|ln)?$
          msg: output goes through the CLI writer, logs through slog
        - pattern: ^log\.(Print|Fatal|Panic)
          msg: logging is log/slog only
    godox:
      keywords:
        - TODO
        - FIXME
        - legacy
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        # A type parameter preserves the caller's concrete type.
        - generic
        # Manifest and artifact owners return heterogeneous implementations.
        - ^github\.com/home-operations/flate/pkg/manifest\.BaseManifest$
        - ^github\.com/home-operations/flate/pkg/store\.Artifact$
        - ^github\.com/home-operations/flate/pkg/schedule\.Dispatcher$
        - ^github\.com/home-operations/flate/pkg/values\.Provider$
        - ^github\.com/home-operations/flate/pkg/source/git\.Connection$
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    revive:
      rules:
        - name: max-control-nesting
          arguments:
            - 4
        - name: file-length-limit
          arguments:
            - max: 800
              skipComments: true
              skipBlankLines: true
        - name: use-any
        - name: argument-limit
          arguments:
            - 4
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
          arguments:
            - maxLength: 2
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
    goconst:
      ignore-tests: true
    wrapcheck:
      extra-ignore-sigs:
        # Cancellation already identifies its cause.
        - (context.Context).Err()
        # Client URL errors already identify the method and target.
        - (*net/http.Client).Do(
      ignore-package-globs:
        - github.com/home-operations/flate/*
  exclusions:
    warn-unused: true
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # Reusable declarations provide process reuse or a stable bucket seed.
      - linters:
          - gochecknoglobals
        source: ^\s*var\s+[A-Za-z_][A-Za-z0-9_]*\s*=\s*(sync\.(Pool\s*\{|OnceValue\s*\()|maphash\.MakeSeed\s*\()
      # Inline Flux specs preserve serialized field order.
      - linters:
          - embeddedstructfieldcheck
        path: ^pkg/manifest/
        text: ^embedded fields should be listed before regular fields$
        source: ^\s*(sourcev1\.(BucketSpec|HelmChartSpec|HelmRepositorySpec|GitRepositorySpec|OCIRepositorySpec|ExternalArtifactSpec)|helmv2\.HelmReleaseSpec|kustomizev1\.KustomizationSpec|fluxopv1\.(ResourceSetSpec|ResourceSetInputProviderSpec))\s
      # Serial fixtures temporarily control these upstream globals.
      - linters:
          - reassign
        path: (_test\.go$|^internal/testutil/dns\.go$|^test/e2e/internal/harness/transport\.go$)
        text:
          ^reassigning variable (DefaultTransport in other package http|DefaultResolver in other package net|Stderr in other
          package os|Local in other package time|MaxDecompressedChartSize in other package archive)$
      # Flux still consumes these deprecated Kustomize inputs.
      - linters:
          - staticcheck
        path: ^(internal/kustomizeinput/input|pkg/kustomize/generate|pkg/loader/(kustomization|occurrences|paths))\.go$
        text: SA1019:.*(Bases|PatchesJson6902|PatchesStrategicMerge|ImageTags|HelmChartInflationGenerator|Vars|/api/builtins).*deprecated
      # Adapter methods must implement the paired upstream signatures.
      - path: ^(internal/(cli|testfixture|testutil)|pkg/(baseline|helm|kustomize|orchestrator|source/(git|gittree)))/
        linters:
          - ireturn
        source: ^func \(
        text:
          ^(Update returns interface \(charm\.land/bubbletea/v2\.Model\)|Load returns interface \(github\.com/go-git/go-git/v6/storage\.Storer\)|EncodedObject
          returns interface \(github\.com/go-git/go-git/v6/plumbing\.EncodedObject\)|Handshake returns interface \(github\.com/go-git/go-git/v6/plumbing/transport\.Session\)|IterReferences
          returns interface \(github\.com/go-git/go-git/v6/plumbing/storer\.ReferenceIter\)|(Open|OpenFile) returns interface \(github\.com/go-git/go-billy/v6\.File\)|Chroot
          returns interface \(github\.com/go-git/go-billy/v6\.Filesystem\)|(Open|Create) returns interface \(sigs\.k8s\.io/kustomize/kyaml/filesys\.File\))$
      # Immutable manifest families retain value method sets.
      - path: ^pkg/manifest/
        linters:
          - gocritic
        source: ^func \(d (DiagnosticIdentity)\)
        text: '^hugeParam: d is heavy \('
      - path: ^pkg/manifest/
        linters:
          - gocritic
        source: ^func \(r (DiagnosticReason|DiscoveryRecord|Reference)\)
        text: '^hugeParam: r is heavy \('
      - path: ^pkg/manifest/
        linters:
          - gocritic
        source: ^func \(p (Production|EmissionPolicy|HelmReleaseHistoryPolicy)\)
        text: '^hugeParam: p is heavy \('
      - path: ^pkg/manifest/
        linters:
          - gocritic
        source: ^func \(h (HelmChart)\)
        text: '^hugeParam: h is heavy \('
      - path: ^pkg/manifest/
        linters:
          - gocritic
        source: ^func \(m (ReferenceMatcher)\)
        text: '^hugeParam: m is heavy \('
      - path: ^pkg/manifest/
        linters:
          - gocritic
        source: ^func \((r|p) (DiagnosticReason|DiscoveryRecord|HelmReleaseHistoryPolicy)\) [[:alnum:]_]+\(other (DiagnosticReason|DiscoveryRecord|HelmReleaseHistoryPolicy)\)
        text: '^hugeParam: other is heavy \('
      - path: _test\.go
        linters:
          - bodyclose
          - dupl
          - errcheck
          - funlen
          - goconst
          - gosec
          - noctx
          - wrapcheck
      - path: _test\.go
        linters:
          - forbidigo
      - path: ^(internal/cli|cmd)/
        linters:
          - forbidigo
      - path: pkg/(source/httpinput|kustomize/flux)\.go
        text: context.Background
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - errcheck
          - unparam
      - path: (_test\.go|^test/e2e/internal/harness/|^internal/testfixture/)
        linters:
          - gosec
  default: standard
formatters:
  enable:
    - goimports
    - golines
    - gofumpt
  settings:
    goimports:
      local-prefixes:
        - github.com/home-operations/flate
    golines:
      max-len: 120
issues:
  max-same-issues: 50
