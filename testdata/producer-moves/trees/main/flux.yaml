apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata: {name: cluster, namespace: flux-system}
spec:
  sync:
    kind: GitRepository
    name: cluster
    url: https://example.invalid/cluster.git
    ref: refs/heads/main
    path: ./main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: original, namespace: flux-system}
spec:
  path: ./apps/main/old
  sourceRef: {kind: GitRepository, name: cluster}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: replacement, namespace: flux-system}
spec:
  path: ./apps/main/new
  sourceRef: {kind: GitRepository, name: cluster}
