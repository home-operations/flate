apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: other
  namespace: other
spec:
  path: ./apps/other
  postBuild:
    substitute:
      SENTINEL: active
    substituteFrom:
    - kind: ConfigMap
      name: optional
      optional: true
  sourceRef:
    kind: GitRepository
    name: cluster
    namespace: flux-system
