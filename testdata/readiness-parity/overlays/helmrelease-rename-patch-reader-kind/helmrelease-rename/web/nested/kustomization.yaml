namespace: web
resources: [web.yaml]
configurations: [kustomizeconfig.yaml]
patches:
  - target: {kind: ConfigMap, name: web}
    patch: |-
      - {op: replace, path: /apiVersion, value: helm.toolkit.fluxcd.io/v2}
      - {op: replace, path: /kind, value: HelmRelease}
      - op: add
        path: /spec
        value:
          interval: 1m
          chart:
            spec:
              chart: ./chart
              sourceRef: {kind: GitRepository, name: cluster, namespace: flux-system}
          dependsOn: [{name: db}]
