apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - media
  - sibling
patches:
  - target: {kind: ConfigMap, name: sibling-settings}
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: sibling-settings
        annotations:
          config.kubernetes.io/origin: 'path: media/plain/deploy.yaml'
