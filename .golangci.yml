version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - containedctx
    - depguard
    - errorlint
    - forbidigo
    - gocritic
    - godox
    - gosec
    - ireturn
    - intrange
    - misspell
    - modernize
    - nakedret
    - nolintlint
    - revive
    - sloglint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
  settings:
    gocritic:
      disable-all: true
      enabled-checks:
        - commentedOutCode
    godox:
      keywords: [TODO, FIXME, legacy]
    ireturn:
      allow:
        - error
        - '^github\.com/home-operations/flate/pkg/schedule\.Dispatcher$'
        - '^github\.com/home-operations/flate/pkg/values\.Provider$'
    nakedret:
      max-func-lines: 0
    sloglint:
      static-msg: true
      kv-only: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    # The dependency flow from AGENTS.md "Layout": a package may import only the layers below it.
    depguard:
      rules:
        stdlib-tests:
          files: ["$all"]
          deny:
            - pkg: github.com/stretchr/testify
              desc: tests use the standard testing package
            - pkg: github.com/onsi/ginkgo
              desc: tests use the standard testing package
            - pkg: github.com/onsi/gomega
              desc: tests use the standard testing package
        tree-stdlib-only:
          list-mode: strict
          files: ["**/pkg/tree/**", "!$test"]
          allow: ["$gostd"]
        claimpath-stdlib-only:
          list-mode: strict
          files: ["**/internal/claimpath/**", "!$test"]
          allow: ["$gostd"]
        leaf:
          files:
            - "**/pkg/manifest/**"
            - "**/pkg/task/**"
            - "**/pkg/source/safepath/**"
            - "**/pkg/source/sourceignore/**"
            - "**/pkg/source/ssrfguard/**"
            - "**/internal/assert/**"
            - "**/internal/chartinput/**"
            - "**/internal/fetcherr/**"
            - "**/internal/kustpath/**"
            - "**/internal/kustomizeinput/**"
            - "**/internal/resourcesetinput/**"
            - "!$test"
          deny:
            - pkg: github.com/home-operations/flate/pkg
              desc: leaf packages import nothing from pkg/
        store:
          files: ["**/pkg/store/**", "!$test"]
          deny:
            - pkg: github.com/home-operations/flate/pkg/loader
              desc: store sits below loader, values, depwait, change and source
            - pkg: github.com/home-operations/flate/pkg/values
              desc: store sits below loader, values, depwait, change and source
            - pkg: github.com/home-operations/flate/pkg/depwait
              desc: store sits below loader, values, depwait, change and source
            - pkg: github.com/home-operations/flate/pkg/change
              desc: store sits below loader, values, depwait, change and source
            - pkg: github.com/home-operations/flate/pkg/source
              desc: store sits below loader, values, depwait, change and source
            - pkg: github.com/home-operations/flate/pkg/kustomize
              desc: store is below the render layer
            - pkg: github.com/home-operations/flate/pkg/helm
              desc: store is below the render layer
            - pkg: github.com/home-operations/flate/pkg/discovery
              desc: store is below the render layer
            - pkg: github.com/home-operations/flate/pkg/baseline
              desc: store is below the render layer
            - pkg: github.com/home-operations/flate/pkg/resourceset
              desc: store is below the render layer
            - pkg: github.com/home-operations/flate/pkg/diff
              desc: store is below the render layer
            - pkg: github.com/home-operations/flate/pkg/controllers
              desc: store is below the controllers
            - pkg: github.com/home-operations/flate/pkg/orchestrator
              desc: store is below the orchestrator
        schedule:
          # A leaf behind its Dispatcher seam: stdlib, manifest and task only.
          list-mode: strict
          files: ["**/pkg/schedule/**", "!$test"]
          allow:
            - $gostd
            - github.com/home-operations/flate/pkg/manifest
            - github.com/home-operations/flate/pkg/task
        middle:
          files:
            - "**/pkg/loader/**"
            - "**/pkg/values/**"
            - "**/pkg/depwait/**"
            - "**/pkg/change/**"
            - "**/pkg/source/**"
            - "!$test"
          deny:
            - pkg: github.com/home-operations/flate/pkg/kustomize
              desc: below the render layer
            - pkg: github.com/home-operations/flate/pkg/helm
              desc: below the render layer
            - pkg: github.com/home-operations/flate/pkg/discovery
              desc: below the render layer
            - pkg: github.com/home-operations/flate/pkg/baseline
              desc: below the render layer
            - pkg: github.com/home-operations/flate/pkg/resourceset
              desc: below the render layer
            - pkg: github.com/home-operations/flate/pkg/diff
              desc: below the render layer
            - pkg: github.com/home-operations/flate/pkg/controllers
              desc: below the controllers
            - pkg: github.com/home-operations/flate/pkg/orchestrator
              desc: below the orchestrator
        diffprep:
          list-mode: strict
          files: ["**/internal/diffprep/**", "!$test"]
          allow:
            - $gostd
            - github.com/home-operations/flate/pkg/manifest
            - github.com/home-operations/flate/pkg/store
            - github.com/home-operations/flate/internal/assert
            - github.com/home-operations/flate/internal/testutil
            - github.com/gonvenience/ytbx
            - github.com/homeport/dyff/pkg/dyff
            - go.yaml.in/yaml/v3
            - sigs.k8s.io/yaml
        output:
          files: ["**/internal/output/**", "!$test"]
          deny:
            - pkg: github.com/home-operations/flate/pkg/diff
              desc: output consumes diffprep, never the SDK boundary
            - pkg: github.com/home-operations/flate/internal/cli
              desc: output sits below CLI presentation
        render:
          files:
            - "**/pkg/kustomize/**"
            - "**/pkg/helm/**"
            - "**/pkg/discovery/**"
            - "**/pkg/baseline/**"
            - "**/pkg/resourceset/**"
            - "**/pkg/diff/**"
            - "!$test"
          deny:
            - pkg: github.com/home-operations/flate/pkg/controllers
              desc: below the controllers
            - pkg: github.com/home-operations/flate/pkg/orchestrator
              desc: below the orchestrator
        controllers-base:
          files: ["**/pkg/controllers/base/**", "!$test"]
          deny:
            - pkg: github.com/home-operations/flate/pkg/controllers/helmrelease
              desc: base is below the kind controllers
            - pkg: github.com/home-operations/flate/pkg/controllers/kustomization
              desc: base is below the kind controllers
            - pkg: github.com/home-operations/flate/pkg/controllers/artifactgenerator
              desc: base is below the kind controllers
            - pkg: github.com/home-operations/flate/pkg/controllers/resourceset
              desc: base is below the kind controllers
            - pkg: github.com/home-operations/flate/pkg/controllers/source
              desc: base is below the kind controllers
            - pkg: github.com/home-operations/flate/pkg/orchestrator
              desc: below the orchestrator
        controllers:
          files: ["**/pkg/controllers/**", "!$test"]
          deny:
            - pkg: github.com/home-operations/flate/pkg/orchestrator
              desc: controllers are below the orchestrator
        no-upward-to-cli:
          files: ["**/pkg/**", "!$test"]
          deny:
            - pkg: github.com/home-operations/flate/internal/cli
              desc: pkg/ never imports internal/cli
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^context\.Background$
          msg: context.Background belongs to internal/cli, or to documented shared work such as the remote fetch workers
        - pattern: ^ioutil\.
          msg: use the io and os packages
        - pattern: ^fmt\.Print(f|ln)?$
          msg: output goes through the CLI writer, logs through slog
        - pattern: ^log\.(Print|Fatal|Panic)
          msg: logging is log/slog only
    revive:
      rules:
        - name: line-length-limit
          arguments: [140]
        - name: function-length
          arguments: [60, 100]
        - name: max-control-nesting
          arguments: [4]
        - name: cognitive-complexity
          arguments: [30]
        - name: file-length-limit
          arguments: [{ max: 800, skipComments: true, skipBlankLines: true }]
        - name: use-any
        - name: argument-limit
          arguments: [4]
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
          arguments: [{ maxLength: 2 }]
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
  exclusions:
    rules:
      # usetesting governs contexts in tests.
      - path: _test\.go
        linters:
          - forbidigo
      # internal/cli owns context.Background and the process's stdout.
      - path: ^(internal/cli|cmd)/
        linters:
          - forbidigo
      # Documented shared work that outlives one caller's cancellation (AGENTS.md "Context"): the remote
      # fetch workers and the cache-lifetime source-root admission.
      - path: pkg/(source/httpinput|kustomize/flux)\.go
        text: context.Background
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - errcheck
          - unparam
      - path: (_test\.go|^test/e2e/internal/harness/)
        linters:
          # gosec's production-security heuristics (G101 hardcoded credentials,
          # …) misfire on test fixtures, which legitimately carry credential-
          # shaped literals — e.g. a Secret/ExternalSecret table keyed on
          # PASSWORD/TOKEN. Test code isn't shipped, so suppress it here.
          - gosec
      # SA5011 trips on `if x == nil { t.Fatal(...) }` followed by
      # `x.Field`. testing.T.Fatal* calls runtime.Goexit, so the
      # deref is unreachable — but the staticcheck build bundled in
      # some golangci-lint platform binaries doesn't recognize it as
      # terminating. Suppress for test files where this idiom is
      # canonical.
      - path: _test\.go
        text: "SA5011"

issues:
  new-from-rev: a99ff8b5072d67b45e4959817dd00fbf7b5c3873
