apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: novnc-kicad
  namespace: flux-system
spec:
  interval: 1h
  path: ./apps/novnc-kicad/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
    namespace: flux-system
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
