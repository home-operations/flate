apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: flux-system
spec:
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.5.0
