apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg18vc-backup
spec:
  concurrencyPolicy: Forbid
  schedule: 0 2 * * *
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: rclone
            image: docker.io/rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
            imagePullPolicy: IfNotPresent
            workingDir: /data
            args:
            - copy
            - ceph:pg18vc
            - cloudflare:kantai-pg18vc
            env:
            - name: RCLONE_VERBOSE
              value: '1'
            - name: RCLONE_CONFIG_CLOUDFLARE_TYPE
              value: s3
            - name: RCLONE_CONFIG_CLOUDFLARE_PROVIDER
              value: Cloudflare
            - name: RCLONE_CONFIG_CLOUDFLARE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: pg18vc-backup
                  key: ACCESS_KEY_ID
            - name: RCLONE_CONFIG_CLOUDFLARE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: pg18vc-backup
                  key: SECRET_ACCESS_KEY
            - name: RCLONE_CONFIG_CLOUDFLARE_REGION
              value: auto
            - name: RCLONE_CONFIG_CLOUDFLARE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: pg18vc-backup
                  key: ENDPOINT
            - name: RCLONE_CONFIG_CLOUDFLARE_ACL
              value: private
            - name: RCLONE_CONFIG_CLOUDFLARE_NO_CHECK_BUCKET
              value: 'true'
            - name: RCLONE_CONFIG_CEPH_TYPE
              value: s3
            - name: RCLONE_CONFIG_CEPH_PROVIDER
              value: Ceph
            - name: RCLONE_CONFIG_CEPH_ENV_AUTH
              value: 'false'
            - name: RCLONE_CONFIG_CEPH_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: pg18vc-obc
                  key: AWS_ACCESS_KEY_ID
            - name: RCLONE_CONFIG_CEPH_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: pg18vc-obc
                  key: AWS_SECRET_ACCESS_KEY
            - name: RCLONE_CONFIG_CEPH_ENDPOINT
              value: https://s3.kantai.xyz
            - name: RCLONE_CONFIG_CEPH_CA_CERT
              value: /certs/ca-certificates.crt
            volumeMounts:
            - name: ca-certificates
              mountPath: /certs
              readOnly: true
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
          restartPolicy: OnFailure
          volumes:
          - name: ca-certificates
            configMap:
              name: cluster-ca-certificates.crt
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
