apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: flux-system, namespace: flux-system}
spec:
  url: https://example.test/cluster.git
  ref: {branch: main}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: forbidden, namespace: flux-system}
spec:
  url: file:///fixture-forbidden
  ref: {branch: main}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app
  namespace: apps
  labels: {app: selected}
spec:
  interval: 10m
  path: ./app
  prune: false
  sourceRef: {kind: GitRepository, name: forbidden, namespace: flux-system}
