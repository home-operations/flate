apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: consumer
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/b
  postBuild:
    substituteFrom:
    - kind: Secret
      name: creds
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
