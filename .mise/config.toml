[tools]
actionlint = "1.7.12"
go = "1.27.3"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.9.0"
golangci-lint = "2.15.0"
lefthook = "2.2.2"
oxfmt = "0.74.0"
zizmor = "1.31.1"

[tasks.fmt]
description = "Run go fmt against code"
run = "go fmt ./..."

[tasks.vet]
description = "Run go vet against code"
run = "go vet ./..."

[tasks.vulncheck]
description = "Scan for known vulnerabilities with govulncheck"
run = "govulncheck ./..."

[tasks.test]
description = "Run tests with race detection and coverage"
run = "go test -buildvcs=true -race $(go list ./...) -coverprofile cover.out"

[tasks.bench]
description = "Run benchmark suite (use BENCH=Pattern to filter, COUNT=N to repeat)"
run = """
mkdir -p bench/results && \
go test -run=^$ -bench="${BENCH:-.}" -benchmem -count="${COUNT:-1}" -timeout=20m ./pkg/loader ./pkg/discovery ./pkg/orchestrator ./pkg/schedule ./pkg/controllers/base ./pkg/controllers/helmrelease ./pkg/controllers/kustomization ./pkg/change ./pkg/manifest ./pkg/store ./pkg/kustomize ./pkg/helm ./pkg/values ./pkg/depwait ./pkg/diff ./pkg/source/git ./pkg/source/gittree ./pkg/source/cache | tee "bench/results/$(date +%Y%m%dT%H%M%S)-$(git rev-parse --short HEAD)$([ -n "$(git status --porcelain)" ] && echo -dirty).txt"
"""

[tasks.bench-baseline]
description = "Refresh bench/baseline.txt by running the bench suite"
run = """
go test -run=^$ -bench=. -benchmem -count=5 -timeout=30m ./pkg/loader ./pkg/discovery ./pkg/orchestrator ./pkg/schedule ./pkg/controllers/base ./pkg/controllers/helmrelease ./pkg/controllers/kustomization ./pkg/change ./pkg/manifest ./pkg/store ./pkg/kustomize ./pkg/helm ./pkg/values ./pkg/depwait ./pkg/diff ./pkg/source/git ./pkg/source/gittree ./pkg/source/cache > bench/baseline.txt
"""

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.lint-fix]
description = "Run golangci-lint with --fix"
run = "golangci-lint run --fix"

[hooks]
postinstall = "lefthook install"
