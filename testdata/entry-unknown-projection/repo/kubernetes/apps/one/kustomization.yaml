apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: one
namePrefix: prefixed-
resources: [namespace.yaml, app/ks.yaml]
replacements:
- source:
    kind: Namespace
    fieldPath: metadata.name
  targets:
  - select: {group: kustomize.toolkit.fluxcd.io, kind: Kustomization}
    fieldPaths: [spec.targetNamespace]
    options: {create: true}
