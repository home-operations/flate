apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: web, namespace: flux-system}
spec:
  interval: 1m
  path: ./web
  prune: true
  sourceRef: {kind: GitRepository, name: cluster, namespace: flux-system}
  patches:
    - target: {kind: HelmRelease, name: web}
      patch: |-
        - op: add
          path: /spec/dependsOn
          value: [{name: db}]
