apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: working
  namespace: flux-system
spec:
  interval: 10m
  url: git://fixture.invalid/cluster
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: consumer
  namespace: apps
spec:
  interval: 10m
  path: ./consumer
  postBuild:
    substitute:
      mode: after
    substituteFrom:
    - kind: ConfigMap
      name: hello
  sourceRef:
    kind: GitRepository
    name: working
    namespace: flux-system
