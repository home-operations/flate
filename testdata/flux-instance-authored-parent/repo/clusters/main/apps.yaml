apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: cluster-apps, namespace: flux-system}
spec:
  interval: 1h
  path: ./apps/main
  sourceRef: {kind: GitRepository, name: sync}
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cluster-info}]
  patches:
    - target: {kind: Kustomization, name: child}
      patch: |-
        - op: add
          path: /spec/postBuild
          value:
            substitute:
              CLUSTER: ${CLUSTER}
