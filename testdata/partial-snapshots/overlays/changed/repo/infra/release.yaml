apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: infra, namespace: apps}
spec:
  interval: 10m
  releaseName: infra
  targetNamespace: infra
  chart:
    spec:
      chart: demo
      version: 0.1.0
      sourceRef: {kind: HelmRepository, name: charts}
  values:
    value: new
