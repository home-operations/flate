apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: sync-producer
  namespace: flux-system
spec:
  dependsOn:
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: fluxinstances.fluxcd.controlplane.io
  resources:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: FluxInstance
      metadata:
        name: flux-system
        namespace: flux-system
      spec:
        sync:
          kind: OCIRepository
          name: flux-system
          url: oci://registry.invalid/cluster
          ref: latest
          path: kubernetes/clusters/cluster-00
