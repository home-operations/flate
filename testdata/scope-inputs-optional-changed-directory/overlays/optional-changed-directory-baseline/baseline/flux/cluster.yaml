apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cluster
  namespace: flux-system
spec:
  url: https://example.test/cluster.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app
  namespace: flux-system
spec:
  path: ./apps/app
  postBuild:
    substitute:
      SENTINEL: active
    substituteFrom:
    - kind: ConfigMap
      name: optional
      optional: true
  sourceRef:
    kind: GitRepository
    name: cluster
