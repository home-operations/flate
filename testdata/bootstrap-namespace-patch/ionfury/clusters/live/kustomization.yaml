apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [sync.yaml]
configMapGenerator:
  - name: healthy
    envs: [versions.env]
generatorOptions: {disableNameSuffixHash: true}
patches:
  - target: {kind: Kustomization, name: bootstrap}
    patch: |-
      - op: add
        path: /metadata/labels
        value: {patched: "yes"}
