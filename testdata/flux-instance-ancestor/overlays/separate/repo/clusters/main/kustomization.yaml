apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-instance.yaml
patches:
  - target:
      kind: FluxInstance
      name: flux
    patch: |-
      - op: add
        path: /spec/kustomize
        value:
          patches:
            - target:
                kind: Kustomization
                name: flux-system
              patch: |
                - op: add
                  path: /spec/commonMetadata
                  value:
                    annotations:
                      witness.example/producer: cluster-package
