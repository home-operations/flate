{
  "apiVersion": "fluxcd.controlplane.io/v1",
  "kind": "ResourceSet",
  "metadata": {
    "name": "owners",
    "namespace": "flux-system"
  },
  "spec": {
    "resourcesTemplate": "apiVersion: kustomize.toolkit.fluxcd.io/v1\nkind: Kustomization\nmetadata:\n  name: owner\n  namespace: flux-system\nspec:\n  path: ./monitoring\n  sourceRef: {kind: GitRepository, name: flux-system}\n"
  }
}
---
{
  "apiVersion": "kustomize.toolkit.fluxcd.io/v1",
  "kind": "Kustomization",
  "metadata": {
    "name": "sibling",
    "namespace": "flux-system"
  },
  "spec": {
    "path": "./healthy",
    "sourceRef": {
      "kind": "GitRepository",
      "name": "flux-system"
    }
  }
}
---
{
  "apiVersion": "kustomize.toolkit.fluxcd.io/v1",
  "kind": "Kustomization",
  "metadata": {
    "name": "dependent",
    "namespace": "flux-system"
  },
  "spec": {
    "dependsOn": [
      {
        "name": "owner"
      }
    ],
    "path": "./healthy",
    "sourceRef": {
      "kind": "GitRepository",
      "name": "flux-system"
    }
  }
}
