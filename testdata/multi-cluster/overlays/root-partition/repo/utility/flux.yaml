apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: cluster
  namespace: flux-system
spec:
  sync:
    kind: GitRepository
    name: cluster
    url: https://example.invalid/cluster.git
    ref: refs/heads/main
    path: ./utility
---
{
  "apiVersion": "kustomize.toolkit.fluxcd.io/v1",
  "kind": "Kustomization",
  "metadata": {
    "name": "shared",
    "namespace": "flux-system"
  },
  "spec": {
    "path": "./utility/app",
    "sourceRef": {
      "kind": "GitRepository",
      "name": "flux-system"
    }
  }
}
