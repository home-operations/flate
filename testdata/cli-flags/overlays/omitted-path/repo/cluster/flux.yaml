apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: flux-system, namespace: flux-system}
spec:
  url: https://example.test/cluster.git
  ref: {branch: main}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app
  namespace: apps
  labels: {app: selected}
spec:
  interval: 10m
  suspend: true
  prune: false
  sourceRef: {kind: GitRepository, name: flux-system, namespace: flux-system}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: app
  namespace: apps
  labels: {app: selected}
spec:
  interval: 10m
  releaseName: installed
  targetNamespace: workloads
  chart:
    spec:
      chart: ./charts/app
      version: 0.1.0
      sourceRef: {kind: GitRepository, name: flux-system, namespace: flux-system}
