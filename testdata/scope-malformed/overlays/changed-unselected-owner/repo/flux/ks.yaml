{
  "apiVersion": "kustomize.toolkit.fluxcd.io/v1",
  "kind": "Kustomization",
  "metadata": {
    "name": "owner",
    "namespace": "flux-system"
  },
  "spec": {
    "path": "./monitoring",
    "sourceRef": {
      "kind": "GitRepository",
      "name": "flux-system"
    }
  }
}
---
{
  "apiVersion": "kustomize.toolkit.fluxcd.io/v1",
  "kind": "Kustomization",
  "metadata": {
    "name": "sibling",
    "namespace": "flux-system"
  },
  "spec": {
    "path": "./healthy",
    "sourceRef": {
      "kind": "GitRepository",
      "name": "flux-system"
    }
  }
}
---
{
  "apiVersion": "kustomize.toolkit.fluxcd.io/v1",
  "kind": "Kustomization",
  "metadata": {
    "name": "dependent",
    "namespace": "flux-system"
  },
  "spec": {
    "dependsOn": [
      {
        "name": "owner"
      }
    ],
    "path": "./healthy",
    "sourceRef": {
      "kind": "GitRepository",
      "name": "flux-system"
    }
  }
}
