apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: web}
spec:
  interval: 1m
  chart:
    spec:
      chart: ./chart
      sourceRef: {kind: GitRepository, name: cluster, namespace: flux-system}
  valuesFrom: [{kind: ConfigMap, name: values}]
  dependsOn:
    - name: db
    - name: values-owner
      readyExpr: >-
        self.spec.valuesFrom[0].name.startsWith('values-') &&
        dep.spec.valuesFrom[0].name.startsWith('values-')
