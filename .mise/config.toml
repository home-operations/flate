min_version = "2026.7.18"

[tools]
go = "1.27.4"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.10.0"
"go:golang.org/x/tools/cmd/deadcode" = "v0.53.0"
golangci-lint = "2.15.0"
lefthook = "2.2.2"
"github:oxc-project/oxc" = { version = "0.79.0", version_prefix = "oxfmt_v", matching_regex = "^oxfmt-", rename_exe = "oxfmt" }
zizmor = "1.32.0"

[tasks.fmt]
description = "Run go fmt against code"
run = "go fmt ./..."

[tasks.vet]
description = "Run go vet against code"
run = "go vet ./..."

[tasks.vulncheck]
description = "Scan for known vulnerabilities with govulncheck"
run = "govulncheck ./..."

[tasks.test]
description = "Run tests with race detection and coverage"
run = "go test -buildvcs=true -race $(go list ./...) -coverprofile cover.out"

[tasks.bench]
description = "Run benchmark suite (use BENCH=Pattern to filter, COUNT=N to repeat)"
run = """
mkdir -p bench/results && \
go test -buildvcs=true -run=^$ -bench="${BENCH:-.}" -benchmem -count="${COUNT:-1}" -timeout=20m ./internal/engine/loader ./internal/engine/discovery ./internal/engine/orchestrator ./internal/engine/schedule ./internal/engine/controllers/base ./internal/engine/controllers/helmrelease ./internal/engine/controllers/kustomization ./internal/engine/change ./pkg/manifest ./internal/engine/store ./internal/engine/kustomize ./internal/engine/helm ./internal/engine/values ./internal/engine/depwait ./internal/engine/diff ./internal/engine/source/git ./internal/engine/source/gittree ./internal/engine/source/cache ./internal/cli | tee "bench/results/$(date +%Y%m%dT%H%M%S)-$(git rev-parse --short HEAD)$([ -n "$(git status --porcelain)" ] && echo -dirty).txt"
"""

[tasks.bench-baseline]
description = "Refresh bench/baseline.txt by running the bench suite"
run = """
go test -buildvcs=true -run=^$ -bench=. -benchmem -count=5 -timeout=30m ./internal/engine/loader ./internal/engine/discovery ./internal/engine/orchestrator ./internal/engine/schedule ./internal/engine/controllers/base ./internal/engine/controllers/helmrelease ./internal/engine/controllers/kustomization ./internal/engine/change ./pkg/manifest ./internal/engine/store ./internal/engine/kustomize ./internal/engine/helm ./internal/engine/values ./internal/engine/depwait ./internal/engine/diff ./internal/engine/source/git ./internal/engine/source/gittree ./internal/engine/source/cache ./internal/cli > bench/baseline.txt
"""

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.deadcode]
description = "Report unreachable functions with deadcode"
run = 'findings=$(deadcode -test ./...) && { [ -z "$findings" ] || { printf "%s\n" "$findings"; exit 1; }; }'

[tasks.lint-fix]
description = "Run golangci-lint with --fix"
run = "golangci-lint run --fix"

[hooks]
postinstall = "lefthook install"
