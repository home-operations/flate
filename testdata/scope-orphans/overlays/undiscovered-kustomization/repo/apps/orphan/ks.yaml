{
  "apiVersion": "kustomize.toolkit.fluxcd.io/v1",
  "kind": "Kustomization",
  "metadata": {
    "name": "orphan",
    "namespace": "flux-system"
  },
  "spec": {
    "interval": "10m",
    "path": "./apps/orphan/does-not-exist",
    "prune": true,
    "sourceRef": {
      "kind": "GitRepository",
      "name": "flux-system"
    },
    "targetNamespace": "orphan"
  }
}
