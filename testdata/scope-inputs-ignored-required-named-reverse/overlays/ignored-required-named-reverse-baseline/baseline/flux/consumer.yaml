apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: consumer
  namespace: flux-system
spec:
  interval: 10m
  path: ./app
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: vars
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
