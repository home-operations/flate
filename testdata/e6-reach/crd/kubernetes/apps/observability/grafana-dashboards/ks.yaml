apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-dashboards
  namespace: observability
spec:
  interval: 1h
  path: ./kubernetes/apps/observability/grafana-dashboards/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
    namespace: flux-system
