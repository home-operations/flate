apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: one
  namespace: flux-system
spec:
  interval: 1m
  provider: github
  ref:
    tag: missing
  secretRef:
    name: unavailable-auth
  url: https://example.invalid/cluster
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: one
  namespace: flux-system
spec:
  path: ./one
  sourceRef:
    kind: GitRepository
    name: one
