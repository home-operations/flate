apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: apps
  namespace: flux-system
spec:
  inputsFrom:
  - name: branches
  resources:
  - apiVersion: v1
    data:
      color: << inputs.color >>
      digest: << inputs.digest >>
      id: << inputs.id | quote >>
      tag: << inputs.tag >>
    kind: ConfigMap
    metadata:
      name: << inputs.tag >>
      namespace: default
