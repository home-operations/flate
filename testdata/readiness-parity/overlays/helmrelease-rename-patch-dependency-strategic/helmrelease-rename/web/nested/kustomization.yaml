namespace: web
resources: [web.yaml, without-dependency.yaml]
patches:
  - target: {kind: HelmRelease, name: without-dependency}
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: without-dependency}
      spec:
        dependsOn: null
  - target: {kind: HelmRelease, name: web}
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: web}
      spec:
        dependsOn: [{name: db}]
