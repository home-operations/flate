apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fixture
  namespace: flux-system
spec:
  interval: 1m
  url: git://remote.fixture.invalid/source
  ref:
    branch: fixture
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: consumer
  namespace: flux-system
spec:
  interval: 1m
  path: ./apps/base
  sourceRef:
    kind: GitRepository
    name: fixture
