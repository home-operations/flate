# Based on the golden config for golangci-lint v2.15.0, with flate rules on top.
# https://github.com/maratori/golangci-lint-config
# Copyright (c) 2021-2025 Marat Reimers. MIT license: https://opensource.org/license/mit
version: "2"
run:
  timeout: 5m
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - clickhouselint
    - containedctx
    - copyloopvar
    - cyclop
    - depguard
    - dupl
    - durationcheck
    - embeddedstructfieldcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - funcorder
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - iface
    - ineffassign
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck
  settings:
    cyclop:
      max-complexity: 30
      package-average: 10.0
    depguard:
      rules:
        deprecated:
          files:
            - $all
          deny:
            - pkg: github.com/golang/protobuf
              desc: Use google.golang.org/protobuf instead, see https://developers.google.com/protocol-buffers/docs/reference/go/faq#modules
            - pkg: github.com/satori/go.uuid
              desc: Use github.com/google/uuid instead, satori's package is not maintained
            - pkg: github.com/gofrs/uuid$
              desc: Use github.com/gofrs/uuid/v5 or later, it was not a go module before v5
        non-test files:
          files:
            - "!$test"
          deny:
            - pkg: math/rand$
              desc: Use math/rand/v2 instead, see https://go.dev/blog/randv2
        non-main files:
          files:
            - "!**/main.go"
          deny:
            - pkg: log$
              desc: Use log/slog instead, see https://go.dev/blog/slog
        stdlib-tests:
          files: ["$all"]
          deny:
            - pkg: github.com/stretchr/testify
              desc: tests use the standard testing package
            - pkg: github.com/onsi/ginkgo
              desc: tests use the standard testing package
            - pkg: github.com/onsi/gomega
              desc: tests use the standard testing package
        tree-stdlib-only:
          list-mode: strict
          files: ["**/pkg/tree/**", "!$test"]
          allow: ["$gostd"]
        claimpath-stdlib-only:
          list-mode: strict
          files: ["**/internal/claimpath/**", "!$test"]
          allow: ["$gostd"]
        inputprojection:
          list-mode: strict
          files: ["**/internal/inputprojection/**"]
          allow:
            - $gostd
            - github.com/home-operations/flate/pkg/manifest
        leaf:
          files:
            - "**/pkg/manifest/**"
            - "**/pkg/task/**"
            - "**/pkg/source/safepath/**"
            - "**/pkg/source/sourceignore/**"
            - "**/pkg/source/ssrfguard/**"
            - "**/internal/assert/**"
            - "**/internal/chartinput/**"
            - "**/internal/fetcherr/**"
            - "**/internal/kustpath/**"
            - "**/internal/kustomizeinput/**"
            - "**/internal/resourcesetinput/**"
            - "!$test"
          deny:
            - pkg: github.com/home-operations/flate/pkg
              desc: leaf packages import nothing from pkg/
        store:
          files: ["**/pkg/store/**", "!$test"]
          deny:
            - pkg: github.com/home-operations/flate/pkg/loader
              desc: store sits below loader, values, depwait, change and source
            - pkg: github.com/home-operations/flate/pkg/values
              desc: store sits below loader, values, depwait, change and source
            - pkg: github.com/home-operations/flate/pkg/depwait
              desc: store sits below loader, values, depwait, change and source
            - pkg: github.com/home-operations/flate/pkg/change
              desc: store sits below loader, values, depwait, change and source
            - pkg: github.com/home-operations/flate/pkg/source
              desc: store sits below loader, values, depwait, change and source
            - pkg: github.com/home-operations/flate/pkg/kustomize
              desc: store is below the render layer
            - pkg: github.com/home-operations/flate/pkg/helm
              desc: store is below the render layer
            - pkg: github.com/home-operations/flate/pkg/discovery
              desc: store is below the render layer
            - pkg: github.com/home-operations/flate/pkg/baseline
              desc: store is below the render layer
            - pkg: github.com/home-operations/flate/pkg/resourceset
              desc: store is below the render layer
            - pkg: github.com/home-operations/flate/pkg/diff
              desc: store is below the render layer
            - pkg: github.com/home-operations/flate/pkg/controllers
              desc: store is below the controllers
            - pkg: github.com/home-operations/flate/pkg/orchestrator
              desc: store is below the orchestrator
        schedule:
          # A leaf behind its Dispatcher seam: stdlib, manifest and task only.
          list-mode: strict
          files: ["**/pkg/schedule/**", "!$test"]
          allow:
            - $gostd
            - github.com/home-operations/flate/pkg/manifest
            - github.com/home-operations/flate/pkg/task
        middle:
          files:
            - "**/pkg/loader/**"
            - "**/pkg/values/**"
            - "**/pkg/depwait/**"
            - "**/pkg/change/**"
            - "**/pkg/source/**"
            - "!$test"
          deny:
            - pkg: github.com/home-operations/flate/pkg/kustomize
              desc: below the render layer
            - pkg: github.com/home-operations/flate/pkg/helm
              desc: below the render layer
            - pkg: github.com/home-operations/flate/pkg/discovery
              desc: below the render layer
            - pkg: github.com/home-operations/flate/pkg/baseline
              desc: below the render layer
            - pkg: github.com/home-operations/flate/pkg/resourceset
              desc: below the render layer
            - pkg: github.com/home-operations/flate/pkg/diff
              desc: below the render layer
            - pkg: github.com/home-operations/flate/pkg/controllers
              desc: below the controllers
            - pkg: github.com/home-operations/flate/pkg/orchestrator
              desc: below the orchestrator
        diffprep:
          list-mode: strict
          files: ["**/internal/diffprep/**", "!$test"]
          allow:
            - $gostd
            - github.com/home-operations/flate/pkg/manifest
            - github.com/home-operations/flate/pkg/store
            - github.com/home-operations/flate/internal/assert
            - github.com/home-operations/flate/internal/testutil
            - github.com/gonvenience/ytbx
            - github.com/homeport/dyff/pkg/dyff
            - go.yaml.in/yaml/v3
            - sigs.k8s.io/yaml
        output:
          files: ["**/internal/output/**", "!$test"]
          deny:
            - pkg: github.com/home-operations/flate/pkg/diff
              desc: output consumes diffprep, never the SDK boundary
            - pkg: github.com/home-operations/flate/internal/cli
              desc: output sits below CLI presentation
        render:
          files:
            - "**/pkg/kustomize/**"
            - "**/pkg/helm/**"
            - "**/pkg/discovery/**"
            - "**/pkg/baseline/**"
            - "**/pkg/resourceset/**"
            - "**/pkg/diff/**"
            - "!$test"
          deny:
            - pkg: github.com/home-operations/flate/pkg/controllers
              desc: below the controllers
            - pkg: github.com/home-operations/flate/pkg/orchestrator
              desc: below the orchestrator
        controllers-base:
          files: ["**/pkg/controllers/base/**", "!$test"]
          deny:
            - pkg: github.com/home-operations/flate/pkg/controllers/helmrelease
              desc: base is below the kind controllers
            - pkg: github.com/home-operations/flate/pkg/controllers/kustomization
              desc: base is below the kind controllers
            - pkg: github.com/home-operations/flate/pkg/controllers/artifactgenerator
              desc: base is below the kind controllers
            - pkg: github.com/home-operations/flate/pkg/controllers/resourceset
              desc: base is below the kind controllers
            - pkg: github.com/home-operations/flate/pkg/controllers/source
              desc: base is below the kind controllers
            - pkg: github.com/home-operations/flate/pkg/orchestrator
              desc: below the orchestrator
        controllers:
          files: ["**/pkg/controllers/**", "!$test"]
          deny:
            - pkg: github.com/home-operations/flate/pkg/orchestrator
              desc: controllers are below the orchestrator
        no-upward-to-cli:
          files: ["**/pkg/**", "!$test"]
          deny:
            - pkg: github.com/home-operations/flate/internal/cli
              desc: pkg/ never imports internal/cli
    embeddedstructfieldcheck:
      forbid-mutex: true
    errcheck:
      check-type-assertions: true
    exhaustive:
      check:
        - switch
        - mapliteral
    exhaustruct_v5:
      ignore-patterns:
        - ^net/http.Client$
        - ^net/http.Cookie$
        - ^net/http.Request$
        - ^net/http.Response$
        - ^net/http.Server$
        - ^net/http.Transport$
        - ^net/url.URL$
        - ^os/exec.Cmd$
        - ^reflect.StructField$
        - ^github.com/Shopify/sarama.Config$
        - ^github.com/Shopify/sarama.ProducerMessage$
        - ^github.com/mitchellh/mapstructure.DecoderConfig$
        - ^github.com/prometheus/client_golang/.+Opts$
        - ^github.com/spf13/cobra.Command$
        - ^github.com/spf13/cobra.CompletionOptions$
        - ^github.com/stretchr/testify/mock.Mock$
        - ^github.com/testcontainers/testcontainers-go.+Request$
        - ^github.com/testcontainers/testcontainers-go.FromDockerfile$
        - ^golang.org/x/tools/go/analysis.Analyzer$
        - ^google.golang.org/protobuf/.+Options$
        - ^gopkg.in/yaml.v3.Node$
      allow-empty-returns: true
      allow-empty-blank-assignments: true
    funcorder:
      struct-method: false
    funlen:
      lines: 100
      statements: 50
    gochecksumtype:
      default-signifies-exhaustive: false
    gocognit:
      min-complexity: 20
    gocritic:
      settings:
        captLocal:
          paramsOnly: false
        underef:
          skipRecvDeref: false
      enabled-checks:
        - commentedOutCode
        - hugeParam
        - rangeValCopy
    godoclint:
      enable:
        - no-unused-link
        - require-stdlib-doclink
    govet:
      enable-all: true
      disable:
        - fieldalignment
      settings:
        shadow: {}
    inamedparam:
      skip-single-param: true
    mnd:
      ignored-functions:
        - args.Error
        - flag.Arg
        - flag.Duration.*
        - flag.Float.*
        - flag.Int.*
        - flag.Uint.*
        - os.Chmod
        - os.Mkdir.*
        - os.OpenFile
        - os.WriteFile
        - prometheus.ExponentialBuckets.*
        - prometheus.LinearBuckets
    nakedret:
      max-func-lines: 0
    nolintlint:
      allow-no-explanation:
        - funlen
        - gocognit
        - golines
      require-explanation: true
      require-specific: true
      allow-unused: false
    perfsprint:
      strconcat: false
      error-format: false
    reassign:
      patterns:
        - .*
    rowserrcheck:
      packages:
        - github.com/jmoiron/sqlx
    sloglint:
      static-msg: true
      kv-only: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1016
        - -QF1008
    usetesting:
      os-temp-dir: true
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^context\.Background$
          msg: context.Background belongs to internal/cli, or to documented shared work such as the remote fetch workers
        - pattern: ^ioutil\.
          msg: use the io and os packages
        - pattern: ^fmt\.Print(f|ln)?$
          msg: output goes through the CLI writer, logs through slog
        - pattern: ^log\.(Print|Fatal|Panic)
          msg: logging is log/slog only
    godox:
      keywords:
        - TODO
        - FIXME
        - legacy
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - ^github\.com/home-operations/flate/pkg/schedule\.Dispatcher$
        - ^github\.com/home-operations/flate/pkg/values\.Provider$
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    revive:
      rules:
        - name: max-control-nesting
          arguments:
            - 4
        - name: file-length-limit
          arguments:
            - max: 800
              skipComments: true
              skipBlankLines: true
        - name: use-any
        - name: argument-limit
          arguments:
            - 4
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
          arguments:
            - maxLength: 2
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
    goconst:
      ignore-tests: true
    wrapcheck:
      ignore-package-globs:
        - github.com/home-operations/flate/*
  exclusions:
    warn-unused: true
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - source: TODO
        linters:
          - godot
      - text: package comment should be of the form ".+"
        source: // ?(nolint|TODO)
        linters:
          - revive
      - text: comment on exported \S+ \S+ should be of the form ".+"
        source: // ?(nolint|TODO)
        linters:
          - revive
          - staticcheck
      - path: _test\.go
        linters:
          - bodyclose
          - dupl
          - errcheck
          - funlen
          - goconst
          - gosec
          - noctx
          - wrapcheck
      - path: _test\.go
        linters:
          - forbidigo
      - path: ^(internal/cli|cmd)/
        linters:
          - forbidigo
      - path: pkg/(source/httpinput|kustomize/flux)\.go
        text: context.Background
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - errcheck
          - unparam
      - path: (_test\.go|^test/e2e/internal/harness/)
        linters:
          - gosec
      - path: _test\.go
        text: SA5011
  default: standard
formatters:
  enable:
    - goimports
    - golines
    - gofumpt
  settings:
    goimports:
      local-prefixes:
        - github.com/home-operations/flate
    golines:
      max-len: 120
issues:
  max-same-issues: 50
