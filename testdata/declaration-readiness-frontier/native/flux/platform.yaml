apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: platform, namespace: flux-system}
spec:
  interval: 1h
  sourceRef: {kind: OCIRepository, name: flux-system, namespace: flux-system}
  path: ./platform
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cluster-vars}]
