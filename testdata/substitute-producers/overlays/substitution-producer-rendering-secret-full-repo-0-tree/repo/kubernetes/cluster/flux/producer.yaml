apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: producer
  namespace: flux-system
spec:
  path: ./kubernetes/cluster/data
  sourceRef: {kind: GitRepository, name: flux-system, namespace: flux-system}
  patches:
  - target: {kind: Secret, name: settings}
    patch: |-
      - op: replace
        path: /data/VERSION
        value: NC42LjI=
