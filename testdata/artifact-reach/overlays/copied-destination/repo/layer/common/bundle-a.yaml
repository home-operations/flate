apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata: {name: bundle-a, namespace: flux-system}
spec:
  sources:
    - {alias: git, kind: GitRepository, name: flux-system}
  artifacts:
    - name: bundle-a
      copy:
        - {from: "@git/payload/one/**", to: "@artifact/renamed-artifact/"}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: consumer, namespace: flux-system}
spec: {interval: 10m, path: ./renamed-artifact, prune: true, targetNamespace: default, sourceRef: {kind: ExternalArtifact, name: bundle-a}}
