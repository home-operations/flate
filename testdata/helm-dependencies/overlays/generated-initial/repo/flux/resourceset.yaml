apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata: {name: apps, namespace: flux-system}
spec:
  inputsFrom:
    - kind: ResourceSetInputProvider
      selector:
        matchLabels: {fixture.test/apps: generated}
  resourcesTemplate: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: << inputs.name >>
      namespace: flux-system
    spec:
      chart:
        spec:
          chart: ./charts/<< inputs.name >>
          sourceRef: {kind: GitRepository, name: flux-system}
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: app
  namespace: flux-system
  labels: {fixture.test/apps: generated}
spec:
  type: Static
  defaultValues: {name: app}
