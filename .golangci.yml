version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - gosec
    - intrange
    - misspell
    - modernize
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unparam
