apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: apps
  namespace: flux-system
spec:
  inputsFrom:
  - name: branches
  resources:
  - apiVersion: v1
    data:
      color: << inputs.color >>
    kind: ConfigMap
    metadata:
      name: << inputs.tenant >>
      namespace: default
  - apiVersion: v1
    data:
      color: excluded
    kind: ConfigMap
    metadata:
      annotations:
        fluxcd.controlplane.io/reconcile: disabled
      name: disabled-<< inputs.tenant >>
      namespace: default
