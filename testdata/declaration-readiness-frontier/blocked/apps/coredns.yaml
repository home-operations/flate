apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: coredns}
spec:
  path: ./coredns
  targetNamespace: kube-system
  sourceRef: {kind: GitRepository, name: flux-system, namespace: flux-system}
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-ipv6-config
