apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kritika-database
  namespace: kritika-system
spec:
  interval: 1h
  path: ./kubernetes/apps/kritika-system/kritika-database/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
    namespace: flux-system
