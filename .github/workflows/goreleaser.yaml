---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: GoReleaser

on:
  workflow_call:
    inputs:
      snapshot:
        description: Build a snapshot instead of publishing a release
        type: boolean
        required: true
    secrets:
      GORELEASER_KEY:
        required: true
      BOT_CLIENT_ID:
        required: false
      BOT_APP_PRIVATE_KEY:
        required: false

jobs:
  split:
    name: Split (${{ matrix.goos }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          experimental: true
          install_args: --locked

      # Keyed per GOOS: GOCACHE entries differ per target. cache-poisoning
      # rationale in .github/zizmor.yml.
      - name: Cache Go build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: goreleaser-go-${{ matrix.goos }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            goreleaser-go-${{ matrix.goos }}-

      - name: Run GoReleaser (split)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro # split/merge + versioned casks are Pro features
          version: "~> v2"
          args: release --clean --split ${{ inputs.snapshot && '--snapshot' || '' }}
        env:
          # GGOOS filters targets without leaking into hooks (GOOS would).
          GGOOS: ${{ matrix.goos }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      - name: Upload partial dist
        if: ${{ !inputs.snapshot }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.goos }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  # Checksums/signing/SBOMs/publish over the combined dist/ — never rebuilds.
  merge:
    name: Merge
    if: ${{ !inputs.snapshot }}
    needs: split
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          experimental: true
          install_args: --locked

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download partial dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Generate Homebrew Tap Token
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write

      - name: Run GoReleaser (merge)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro # split/merge + versioned casks are Pro features
          version: "~> v2"
          args: continue --merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
