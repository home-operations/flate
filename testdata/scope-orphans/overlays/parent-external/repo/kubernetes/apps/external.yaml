{
  "apiVersion": "source.toolkit.fluxcd.io/v1",
  "kind": "GitRepository",
  "metadata": {
    "name": "external",
    "namespace": "flux-system"
  },
  "spec": {
    "provider": "github",
    "secretRef": {
      "name": "missing-auth"
    },
    "url": "https://fixture.invalid/external"
  }
}
---
{
  "apiVersion": "kustomize.toolkit.fluxcd.io/v1",
  "kind": "Kustomization",
  "metadata": {
    "name": "external-parent",
    "namespace": "flux-system"
  },
  "spec": {
    "path": "./kubernetes/apps/orphan",
    "sourceRef": {
      "kind": "GitRepository",
      "name": "external"
    }
  }
}
