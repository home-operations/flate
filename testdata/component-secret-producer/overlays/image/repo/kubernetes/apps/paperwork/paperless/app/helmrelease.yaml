{
  "apiVersion": "helm.toolkit.fluxcd.io/v2",
  "kind": "HelmRelease",
  "metadata": {
    "name": "paperless",
    "namespace": "paperwork"
  },
  "spec": {
    "chart": {
      "spec": {
        "chart": "./charts/paperless",
        "sourceRef": {
          "kind": "GitRepository",
          "name": "flux-system",
          "namespace": "flux-system"
        }
      }
    },
    "interval": "1h",
    "values": {
      "image": {
        "tag": "v2"
      }
    }
  }
}
